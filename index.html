async function renderRecords(editId=null){let targetPage=page;await fetchLiveFx();if(page!==targetPage||!$('#app'))return;let e=editId?records.find(x=>x.id===editId):null,opts=DATA.cards.filter(c=>enabled.includes(c.id)).map(c=>`<option value="${c.id}" ${e&&e.cardId===c.id?'selected':''}>${c.name} ${pct(c.rate)}｜${c.category}</option>`).join('');$('#app').innerHTML=`<h1>消費紀錄</h1><div class="panel" id="recommendBox"><h2 style="margin-top:0">先算這筆該刷哪張卡</h2><p class="note">輸入預計消費金額後，自動依「我的卡片」、累積消費與目前剩餘回饋額度比較，推薦實際可取得回饋最高的前三個方案。</p><div class="grid"><div class="field"><label>消費幣別</label><select id="ccur" onchange="doCalc()"><option value="JPY">JPY 日圓</option><option value="TWD">TWD 台幣</option></select></div><div class="field"><label>預計消費金額</label><input id="camt" type="number" min="0" value="" placeholder="請輸入金額" oninput="doCalc()"></div><div class="field"><label>回饋方案類型</label><select id="ccat" onchange="doCalc()"><option>全部</option><option>限定加值卡用</option><option>指定用法/通路</option><option>通用型</option></select></div></div><div id="calcOut"><div class="preview">請先輸入預計消費金額，系統才會開始計算推薦。</div></div></div><div class="panel" id="entryBox"><h2 style="margin-top:0">${e?'編輯':'新增'}消費紀錄</h2><div id="selectedRecommendation" class="note">${e?'正在編輯既有紀錄':'可以先使用上方推薦，再點選卡片自動帶入這裡。'}</div><div class="grid"><div class="field"><label>日期</label><input id="rdate" type="date" value="${e?.date||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>信用卡／方案</label><select id="rcard" onchange="updateSelectedCardNote();checkSelectedLimit()">${opts}</select></div><div id="selectedCardNote" class="preview" style="grid-column:1/-1;margin:0"></div><div class="field"><label>幣別</label><select id="rcur" onchange="previewConversion();checkSelectedLimit()"><option value="JPY" ${!e||e.currency==='JPY'?'selected':''}>JPY 日圓</option><option value="TWD" ${e?.currency==='TWD'?'selected':''}>TWD 台幣</option></select></div><div class="field"><label>原始消費金額</label><input id="ramt" type="number" min="0" valu function doCalc(){let input=$('#camt');if(!input)return;let raw=input.value.trim();if(raw===''){ $('#calcOut').innerHTML='<div class="preview">請先輸入預計消費金額，系統才會開始計算推薦。</div>';return}let amt=Number(raw);if(!(amt>0)){ $('#calcOut').innerHTML='<div class="warning">請輸入大於 0 的消費金額。</div>';return}let cur=$('#ccur')?.value||'JPY',cat=$('#ccat')?.value||'全部',twd=cur==='JPY'?amt*liveFx.twdPerJpy:amt;let candidates=DATA.cards.filter(c=>enabled.includes(c.id)&&(cat==='全部'||c.category===cat)).map(c=>{let rem=remaining(c),usable=Math.min(twd,rem),reward=usable*c.rate,exceed=isFinite(rem)&&twd>rem;return{c,usable,reward,rem,exceed,over:exceed?twd-rem:0}}).filter(x=>x.rem>0).sort((a,b)=>b.reward-a.reward||b.c.rate-a.c.rate).slice(0,3);let limited=candidates.filter(x=>x.exceed);$('#calcOut').innerHTML=`<div class="preview">${cur} ${fmt(amt)} ≈ <strong>NT$${fmt(twd)}</strong><br><span class="note">已將既有消費紀錄扣除後的剩餘額度納入計算。</span></div>${limited.length?`<div class="warning"><b>⚠ 此次消費超過部分推薦方案的剩餘回饋額度</b><br>${limited.map(x=>`${x.c.name}：剩餘 NT$${fmt(x.rem)}，本次約超出 NT$${fmt(x.over)}；超出部分不以此優惠回饋率計算。`).join('<br>')}</div>`:''}<h3>最優惠 Top 3</h3>${candidates.length?candidates.map((x,i)=>`<div class="recommend ${i===0?'recTop':''}" onclick="applyRecommendation(${x.c.id})"><b><span class="medal">${['🥇','🥈','🥉'][i]}</span>${x.c.name} ${i===0?'<span class="badge">推薦刷這張</span>':''}</b><p>此次在剩餘額度內預估回饋 <b>NT$${fmt(x.reward)}</b> · 回饋率 ${pct(x.c.rate)}</p><span class="note">${x.c.category}｜可計優惠金額 NT$${fmt(x.usable)}｜剩餘額度 ${isFinite(x.rem)?'NT$'+fmt(x.rem):'無上限'}</span>${x.exceed?`<div class="warning">⚠ 本次消費約超出此方案剩餘額度 NT$${fmt(x.over)}</div>`:''}<div class="chooseHint">選擇這張卡並帶入下方消費紀錄 ↓</div></div>`).join(''):'<div class="warning">目前「我的卡片」沒有符合條件且仍有回饋額度的方案。</div>'}`}
function applyRecommendation(cardId){let amt=Number($('#camt')?.value||0),cur=$('#ccur')?.value||'JPY';$('#rcard').value=String(cardId);$('#rcur').value=cur;$('#ramt').value=amt||'';$('#rrate').value=liveFx.twdPerJpy;previewConversion();checkSelectedLimit(true);let c=DATA.cards.find(x=>x.id===cardId);$('#selectedRecommendation').innerHTML=`<span class="badge">已選擇</span> ${c?.name||''}，金額與幣別已由上方試算帶入。`;$('#entryBox').scrollIntoView({behavior:'smooth',block:'start'})}
function checkSelectedLimit(pop=false){let sel=$('#rcard'),box=$('#limitWarning');if(!sel||!box)return false;let c=DATA.cards.find(x=>x.id===Number(sel.value));if(!c)return false;let twd=Number($('#rtwd')?.value||0),rem=remaining(c),over=isFinite(rem)&&twd>rem;if(over){let msg=`⚠ 本筆換算約 NT$${fmt(twd)}，已超過 ${c.name} 剩餘回饋額度 NT$${fmt(rem)}，約有 NT$${fmt(twd-rem)} 無法使用此方案優惠回饋率。`;box.innerHTML=`<div class="warning"><b>超過剩餘回饋額度</b><br>${msg}</div>`;if(pop&&window.__lastLimitMsg!==msg){window.__lastLimitMsg=msg;alert(msg)}return true}box.innerHTML='';window.__lastLimitMsg='';return false}
function previewConversion(){let a=Number($('#ramt')?.value||0),cur=$('#rcur')?.value||'JPY',rate=Number($('#rrate')?.value||liveFx.twdPerJpy),t=cur==='JPY'?a*rate:a;if($('#rtwd')&&!$('#rtwd').dataset.edited)$('#rtwd').value=t?Math.round(t):'';checkSelectedLimit();let box=$('#convPreview');if(box)box.innerHTML=`<div class="preview"><span class="statusdot ${liveFx.quality==='fallback'?'fallback':''}"></span>預估換算：<strong>NT$${fmt(t)}</strong><br><span class="note">1 JPY ≈ NT$${rate.toFixed(6)} · ${liveFx.source}</span>${liveFx.quality==='fallback'?'<div class="warning">⚠ 暫時無法取得最新匯率，目前使用備援／快取匯率。換算數字可能需要確認，新增後仍可編輯。</div>':''}</div>`}
function saveRecord(editId=''){let id=Number($('#rcard').value),amt=Number($('#ramt').value),cur=$('#rcur').value,rate=Number($('#rrate').value||liveFx.twdPerJpy),twd=Number($('#rtwd').value);if(!amt||amt<=0)return alert('請輸入大於 0 的消費金額');if(checkSelectedLimit(false)&&!confirm('這筆消費已超過所選方案的剩餘回饋額度，超出部分不會以優惠回饋率計算。仍要儲存這筆消費嗎？'))return;if(!twd&&cur==='TWD')twd=amt;if(!twd&&cur==='JPY')twd=amt*rate;let c=DATA.cards.find(x=>x.id===id),old=editId?records.find(x=>x.id===editId):null,obj={id:editId||('exp-'+Date.now()+'-'+Math.random().toString(36).slice(2,7)),date:$('#rdate').value,cardId:id,card:c.name,category:c.category,plan:planLabelByCard(c),expenseType:$('#rtype').value,merchant:$('#rmerchant').value,note:$('#rnote').value,currency:cur,amount:amt,fxRate:rate,twd,reward:Math.min(twd,c.spendLimit?Math.max(0,c.spendLimit-spentForExcluding(c,editId)):twd)*c.rate,fxNeedsReview:liveFx.quality==='fallback',fxSource:liveFx.source,_updatedAt:Date.now(),_deletedAt:0};if(old)records[records.findIndex(x=>x.id===editId)]=obj;else records.unshift(obj);save();renderRecords();alert(old?'消費紀錄已更新':'消費紀錄已新增')}

async function renderStats(){destroyStatCharts();let types=[...new Set(records.map(r=>r.expenseType||'未分類'))],merchants=[...new Set(records.map(r=>r.merchant||'未填商家'))],usedCards=[...new Map(records.map(r=>[r.cardId||r.card,{id:r.cardId,name:r.card}])).values()];$('#app').innerHTML=`<h1>統計</h1><div class="panel"><b>交互篩選</b><div class="grid" style="margin-top:10px"><div class="field"><label>起始日期</label><input id="sFrom" type="date" onchange="updateStats()"></div><div class="field"><label>結束日期</label><input id="sTo" type="date" onchange="updateStats()"></div></div><div style="margin-top:12px"><span class="note">卡別</span><div class="statFilters">${usedCards.map(c=>`<label class="statCheck"><input class="sCard" type="checkbox" value="${c.id}" onchange="updateStats()">${c.name}</label>`).join('')||'<span class="note">尚無資料</span>'}</div></div><div style="margin-top:12px"><span class="note">消費類別</span><div class="statFilters">${types.map(x=>`<label class="statCheck"><input class="sType" type="checkbox" value="${x}" onchange="updateStats()">${x}</label>`).join('')||'<span class="note">尚無資料</span>'}</div></div><div style="margin-top:12px"><span class="note">商家</span><div class="statFilters">${merchants.map(x=>`<label class="statCheck"><input class="sMerchant" type="checkbox" value="${x}" onchange="updateStats()">${x}</label>`).join('')||'<span class="note">尚無資料</span>'}</div></div><p><button class="secondary" onclick="clearStatFilters()">清除篩選</button> <button class="primary" onclick="exportStats()">匯出目前選取資料 CSV</button></p></div><div id="statKPIs"></div><div class="statsgrid"><div class="chartbox"><b>消費類別占比</b><canvas id="pieChart"></canvas></div><div class="chartbox"><b>信用卡消費金額</b><canvas id="barChart"></canvas></div><div class="chartbox" style="grid-column:1/-1"><b>每日消費趨勢</b><canvas id="lineChart"></canvas></div></div><div class="panel" style="margin-top:14px"><h2 style="margin-top:0">依目前消費後的剩餘額度推薦</h2><p class="note">以下分別從不同回饋類別，依目前已登記消費扣除後，列出前五大仍可使用的方案與約可再刷金額。手機或較窄畫面可左右拖 async function updateStats(){let rs=statFilteredRecords(),total=rs.reduce((a,r)=>a+Number(r.twd||r.amount||0),0),reward=rs.reduce((a,r)=>a+Number(r.reward||0),0),avg=rs.length?total/rs.length:0;$('#statKPIs').innerHTML=`<div class="kpis" style="margin-bottom:14px"><div class="kpi">篩選後消費<b>NT$${fmt(total)}</b></div><div class="kpi">交易筆數<b>${rs.length}</b></div><div class="kpi">單筆平均<b>NT$${fmt(avg)}</b></div><div class="kpi">預估回饋<b>NT$${fmt(reward)}</b></div></div>`;renderStatRecs();destroyStatCharts();try{await loadChartJs();let palette=['#2563eb','#0ea5e9','#14b8a6','#22c55e','#eab308','#f97316','#ef4444','#8b5cf6','#ec4899','#64748b'];let a=groupSum(rs,r=>r.expenseType||'未分類'),b=groupSum(rs,r=>r.card||'未知卡片'),d=groupSum(rs,r=>r.date||'未填日期'),dates=Object.keys(d).sort();statCharts.push(new Chart($('#pieChart'),{type:'doughnut',data:{labels:Object.keys(a),datasets:[{data:Object.values(a),backgroundColor:palette}]},options:{responsive:true,maintainAspectRatio:false,onClick:(e,els)=>{if(els[0])toggleStatByLabel('.sType',Object.keys(a)[els[0].index])}}}));statCharts.push(new Chart($('#barChart'),{type:'bar',data:{labels:Object.keys(b),datasets:[{label:'消費金額 NT$',data:Object.values(b),backgroundColor:'#2563eb'}]},options:{responsive:true,maintainAspectRatio:false,onClick:(e,els)=>{if(els[0])toggleCardStat(Object.keys(b)[els[0].index])},scales:{y:{beginAtZero:true}}}}));statCharts.push(new Chart($('#lineChart'),{type:'line',data:{labels:dates,datasets:[{label:'每日消費 NT$',data:dates.map(x=>d[x]),borderColor:'#2563eb',backgroundColor:'#93c5fd',tension:.25}]},options:{responsive:true,maintainAspectRatio:false,interaction:{intersect:false,mode:'index'}}}));}catch(e){document.querySelectorAll('.chartbox').forEach(x=>x.innerHTML+='<div class="warning">圖表元件載入失敗，統計數字與匯出功能仍可使用。請確認網路連線。</div>')}}

function clearStatFilters(){['sFrom','sTo'].forEach(x=>{if($('#'+x))$('#'+x).value=''});document.querySelectorAll('.sCard,.sType,.sMerchant').forEach(x=>x.checked=false);updateStats()}
function exportStats(){let rs=statFilteredRecords(),headers=['日期','信用卡','回饋方案','消費類別','商家','幣別','原幣金額','匯率','台幣金額','預估回饋'],data=rs.map(r=>[r.date,r.card,r.plan||recordPlanLabel(r),r.expenseType||'其他',r.merchant,r.currency,r.amount,r.fxRate,r.twd||r.amount,r.reward||0]);downloadNamedCsv(namedCsvRows(headers,data),'統計篩選消費資料')}
function renderStatRecs(){let cats=['限定加值卡用','指定用法/通路','通用型'];$('#statRecs').innerHTML=cats.map(cat=>{let x=DATA.cards.filter(c=>enabled.includes(c.id)&&c.category===cat&&remaining(c)>0).sort((a,b)=>b.rate-a.rate||remaining(b)-remaining(a)).slice(0,5);return `<div style="margin-bottom:18px"><div class="groupTitle">${cat}</div><div class="recommendGrid" style="display:flex;grid-template-columns:none;overflow-x:auto;gap:10px;padding-bottom:8px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch">${x.length?x.map((c,i)=>`<div class="miniRec" style="flex:0 0 min(260px,78vw);scroll-snap-align:start"><b>${i+1}. ${c.name}</b><p><span class="badge">${pct(c.rate)}</span></p><div class="note">目前已刷 NT$${fmt(spentFor(c))}<br>${isFinite(remaining(c))?`約還可刷 <b>NT$${fmt(remaining(c))}</b>`:'刷卡回饋額度無上限'}</div></div>`).join(''):'<div class="note">目前沒有已啟用且仍有額度的方案。</div>'}</div></div>`}).join('')}
function fxFetchMeta(){let t=Number(liveFx?.savedAt||0);let time=t?new Date(t).toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}):(liveFx?.date||'未知');return `最後抓取：${time}｜來源：${liveFx?.source||'未知'}`}
async function renderFx(){let targetPage=page;await fetchLiveFx();if(page!==targetPage||!$('#app'))return;let r=liveFx.twdPerJpy;$('#app').innerHTML=`<h1>匯率換算與刷卡推薦</h1><div class="kpis"><div class="kpi">1 日圓 ≈<b>NT$${r.toFixed(6)}</b></div><div class="kpi">1 台幣 ≈<b>¥${Number(liveFx.jpyPerTwd).toFixed(4)}</b></div></div><div class="panel" style="margin-top:12px"><div class="grid"><div class="field"><label>預計消費幣別</label><select id="fxcur"><option value="JPY">JPY 日圓</option><option value="TWD">TWD 台幣</option></select></div><div class="field"><label>預計消費金額</label><input id="fxamt" type="number" value="0"></div><div class="field"><label>海外手續費</label><select id="fee"><option value="0.015">1.5%</option><option value="0">0%</option></select></div></div><p><button class="primary" onclick="recommend()">換算並推薦</button> <button class="secondary" onclick="refreshFx()">↻ 更新匯率</button> <span class="note" id="fxFetchMeta" style="margin-left:8px">${fxFetchMeta()}</span></p><div id="fxout"></div></div><div class="panel"><b>線上匯率狀態</b><p class="note">來源：${liveFx.source}｜資料日期：${liveFx.date}｜頁面載入時自動查詢，使用 15 分鐘快取。可設定較高更新頻率的 currencyapi.com Key；失敗時自動改用公開來源、最近快取，最後才回退 Excel。</p><button class="secondary" onclick="setFastKey()">設定較即時匯率 API Key</button></div>`;recommend()}
async function refreshFx(){localStorage.removeItem(STORAGE_KEYS.fx);await fetchLiveFx(true);renderFx()}
function recommend(){let amt=Number($('#fxamt').value||0),cur=$('#fxcur').value,fee=Number($('#fee').value),twd=cur==='JPY'?amt*liveFx.twdPerJpy:amt,gross=twd*(1+fee);let recs=DATA.cards.filter(c=>enabled.includes(c.id)&&remaining(c)>0).map(c=>{let use=Math.min(twd,remaining(c));return {c,use,reward:use*c.rate,net:use*c.rate-twd*fee}}).sort((a,b)=>b.net-a.net).slice(0,3);$('#fxout').innerHTML=`<div class="recommend"><b>換算結果</b><p>${cur} ${fmt(amt)} ≈ NT$${fmt(twd)}；含 ${(fee*100).toFixed(1)}% 手續費約 NT$${fmt(gross)}</p><b>建議刷卡順序</b>${recs.map((x,i)=>`<div class="recitem"><b>${i+1}. ${x.c.name} ${pct(x.c.rate)}</b><br><span class="note">可用額度 NT$${isFinite(remaining(x.c))?fmt(remaining(x.c)):'無上限'}｜此筆預估回饋 NT$${fmt(x.reward)}｜扣手續費淨效益約 NT$${fmt(x.net)}</span></div>`).join('')}</div>`}
function bankName(c){let n=(c.name||'').trim();return n.split(/[ _-]/)[0].replace(/卡$/,'')}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function renderWallet(){let banks=[...new Set(DATA.cards.map(bankName))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'zh-Hant'));let rows=DATA.cards.map(c=>`<div class="row"><input type="checkbox" ${enabled.includes(c.id)?'checked':''} onchange="toggleCard(${c.id},this.checked)"><div><div class="ctitle">${esc(c.name)}<span class="net">${esc(c.network)}</span>${c.custom?'<span class="badge">自訂</span>':''}</div><div class="desc">${esc(c.category)}｜${pct(c.rate)}${c.restriction?'｜'+esc(c.restriction):''}</div></div><div class="limits">${c.spendLimit?'上限 NT$'+fmt(c.spendLimit):'無上限'}<div class="actions" style="margin-top:6px"><button class="edit" onclick="editCard(${c.id})">編輯</button><button class="del" onclick="deleteAnyCard(${c.id})">刪除</button></div></div></div>`).join('');$('#app').innerHTML=`<h1>我的卡片</h1><p class="note">可勾選既有卡片，也可新增自己的信用卡回饋方案。若未持有，請取消勾選卡片即可。刪除卡片功能是整張移除。新增、修改或刪除後，消費紀錄、推薦計算、回饋清單與統計會立即連動。</p><div class="panel"><div class="actions"><button class="primary" onclick="showCustomCardForm()">＋ 新增卡片／方案</button><button class="secondary" onclick="showDeletedCards()">已刪除卡片（${deletedCardLog.length}）</button><button class="secondary" onclick="selectAllCards()">全部勾選</button><button class="secondary" onclick="clearAllCards()">取消全部勾選</button></div><div id="customCardForm"></div><div class="filters" style="margin-top:14px"><b style="align-self:center;margin-right:4px">依銀行勾選：</b>${banks.map(b=>`<button class="pill ${bankAllSelected(b)?'active':''}" onclick="toggleBank('${b.replaceAll("'","\\'")}')">${esc(b)}</button>`).join('')}</div></div><div class="list">${rows}</div>${backupPanel()}`;updateBackupStatus();updateCloudStatus()}
function showCustomCardForm(id=null){let c=id?DATA.cards.find(x=>x.id===id):null,box=$('#customCardForm');if(!box)return;box.innerHTML=`<div class="panel" style="margin-top:14px;background:#fafafa"><h3 style="margin-top:0">${c?'編輯卡片／方案':'新增自訂卡片／方案'}</h3><div class="grid"><div class="field"><label>信用卡名稱</label><input id="ucName" value="${esc(c?.name||'')}" placeholder="例如 台新 FlyGo 卡"></div><div class="field"><label>發卡組織</label><select id="ucNetwork"><option ${c?.network==='Visa'?'selected':''}>Visa</option><option ${c?.network==='Master'?'selected':''}>Master</option><option ${c?.network==='JCB'?'selected':''}>JCB</option><option ${c?.network==='Visa/JCB/Master'?'selected':''}>Visa/JCB/Master</option></select></div><div class="field"><label>回饋方案類型</label><select id="ucCategory"><option ${c?.category==='限定加值卡用'?'selected':''}>限定加值卡用</option><option ${c?.category==='指定用法/通路'?'selected':''}>指定用法/通路</option><option ${!c||c?.category==='通用型'?'selected':''}>通用型</option></select></div><div class="field"><label>回饋率 (%)</label><input id="ucRate" type="number" step="0.1" min="0" value="${c?c.rate*100:''}" placeholder="例如 3"></div><div class="field"><label>可享回饋消費上限 (TWD)</label><input id="ucSpendLimit" type="number" min="0" value="${c?.spendLimit||''}" placeholder="留空代表無上限"></div><div class="field"><label>回饋上限 (TWD)</label><input id="ucRewardLimit" type="number" min="0" value="${esc(c?.rewardLimit||'')}" placeholder="可留空"></div><div class="field" style="grid-column:1/-1"><label>方案限制／適用通路</label><input id="ucRestriction" value="${esc(c?.restriction||'')}" placeholder="例如 海外實體消費、需登錄、指定通路"></div><div class="field" style="grid-column:1/-1"><label>備註</label><input id="ucNote" value="${esc(c?.note||'')}" placeholder="其他提醒"></div></div><p><button class="primary" onclick="saveCustomCard(${c?.id||0})">${c?'儲存變更':'新增並勾選'}</button> <button class="secondary" onclick="$('#customCardForm').innerHTML=''">取消</button></p></div>`}
function saveCustomCard(id=0){let name=$('#ucName').value.trim(),rate=Number($('#ucRate').value);if(!name)return alert('請輸入信用卡名稱');if(!Number.isFinite(rate)||rate<0)return alert('請輸入有效的回饋率');let old=id?customCards.find(x=>x.id===id):null,c={id:id||Date.now()*10+Math.floor(Math.random()*10),name,network:$('#ucNetwork').value,rate:rate/100,rewardLimit:$('#ucRewardLimit').value.trim(),spendLimit:Number($('#ucSpendLimit').value)||0,category:$('#ucCategory').value,restriction:$('#ucRestriction').value.trim(),note:$('#ucNote').value.trim(),local:true,custom:true,_updatedAt:Date.now()};if(id){let ci=customCards.findIndex(x=>x.id===id);if(ci>=0)customCards[ci]=c;else customCards.push(c)}else customCards.push(c);let di=DATA.cards.findIndex(x=>x.id===c.id);if(di>=0)DATA.cards[di]=c;else DATA.cards.push(c);enabled=[...new Set([...enabled,c.id])];persistCustomCards();renderWallet()}
function editCard(id){showCustomCardForm(id)}
function editCustomCard(id){showCustomCardForm(id)}
function saveDeletedCardState(){localStorage.setItem(STORAGE_KEYS.deletedCards,JSON.stringify(deletedCards));localStorage.setItem(STORAGE_KEYS.deletedCardLog,JSON.stringify(deletedCardLog));persistCustomCards()}
function deleteAnyCard(id){let c=DATA.cards.find(x=>x.id===id);if(!c)return;let hasRecords=records.some(r=>r.cardId===id),msg=hasRecords?'這張卡已有消費紀錄。刪除卡片後，既有消費紀錄會完整保留，但此卡會從可使用的卡片清單移除。確定刪除嗎？':'確定刪除這張卡片／方案「'+c.name+'」嗎？';if(!confirm(msg))return;let entry={id:c.id,card:{...c},wasCustom:customCards.some(x=>x.id===id),wasEnabled:enabled.includes(id),deletedAt:new Date().toISOString()};deletedCardLog=deletedCardLog.filter(x=>x.id!==id);deletedCardLog.unshift(entry);deletedCards=[...new Set([...deletedCards,id])];customCards=customCards.filter(x=>x.id!==id);DATA.cards=DATA.cards.filter(x=>x.id!==id);enabled=enabled.filter(x=>x!==id);saveDeletedCardState();renderWallet()}
function restoreDeletedEntries(entries){if(!entries.length)return;entries.forEach(x=>{let c=x.card||x;if(!c||c.id==null)return;deletedCards=deletedCards.filter(id=>id!==c.id);let di=DATA.cards.findIndex(v=>v.id===c.id);if(di>=0)DATA.cards[di]=c;else DATA.cards.push(c);if(x.wasCustom&&!customCards.some(v=>v.id===c.id))customCards.push(c);if(x.wasEnabled&&!enabled.includes(c.id))enabled.push(c.id)});let ids=new Set(entries.map(x=>x.id));deletedCardLog=deletedCardLog.filter(x=>!ids.has(x.id));saveDeletedCardState();showDeletedCards()}
function restoreSelectedDeleted(){let ids=[...document.querySelectorAll('.delRestore:checked')].map(x=>Number(x.value)),xs=deletedCardLog.filter(x=>ids.includes(x.id));if(!xs.length)return alert('請先勾選要復原的卡片');restoreDeletedEntries(xs)}
function restoreAllDeleted(){if(!deletedCardLog.length)return;if(confirm('確定復原全部 '+deletedCardLog.length+' 張已刪除卡片嗎？'))restoreDeletedEntries([...deletedCardLog])}
function showDeletedCards(){let list=deletedCardLog.map(x=>`<label class="row"><input class="delRestore" type="checkbox" value="${x.id}"><div><div class="ctitle">${esc(x.card?.name||('卡片 #'+x.id))}${x.wasCustom?'<span class="badge">自訂</span>':''}</div><div class="desc">刪除時間：${x.deletedAt?new Date(x.deletedAt).toLocaleString('zh-TW'):'舊版刪除記錄'}｜${x.wasEnabled?'原為已勾選':'原為未勾選'}</div></div><div class="limits"><button class="secondary" onclick="restoreDeletedEntries(deletedCardLog.filter(v=>v.id===${x.id}))">復原</button></div></label>`).join('');$('#app').innerHTML=`<h1>已刪除卡片</h1><p class="note">這裡只管理被刪除的卡片設定。相關歷史消費紀錄不會因刪除卡片而被移除。</p><div class="panel"><div class="actions"><button class="primary" onclick="restoreSelectedDeleted()">復原勾選項目</button><button class="secondary" onclick="restoreAllDeleted()">全部復原</button><button class="secondary" onclick="renderWallet()">返回我的卡片</button></div></div><div class="list">${list||'<div class="panel"><span class="note">目前沒有可復原的刪除記錄。</span></div>'}</div>`}
function deleteCustomCard(id){let c=customCards.find(x=>x.id===id);if(!c)return;if(records.some(r=>r.cardId===id)){if(!confirm('這張卡已有消費紀錄。刪除卡片後，既有消費紀錄會保留卡名與方案快照，但之後不能再選此卡。仍要刪除嗎？'))return}else if(!confirm('確定刪除這張自訂卡片／方案？'))return;customCards=customCards.filter(x=>x.id!==id);let i=DATA.cards.findIndex(x=>x.id===id);if(i>=0)DATA.cards.splice(i,1);enabled=enabled.filter(x=>x!==id);persistCustomCards();renderWallet()}
function persistCustomCards(){localStorage.setItem(STORAGE_KEYS.customCards,JSON.stringify(customCards));localStorage.setItem(STORAGE_KEYS.enabled,JSON.stringify(enabled));saveAutoBackup('custom-cards-change');scheduleCloudSync()}
function persistEnabled(){localStorage.setItem(STORAGE_KEYS.enabled,JSON.stringify(enabled));saveAutoBackup('wallet-change');scheduleCloudSync()}
function selectAllCards(){enabled=DATA.cards.map(c=>c.id);persistEnabled();renderWallet()}
function clearAllCards(){enabled=[];persistEnabled();renderWallet()}
function bankIds(b){return DATA.cards.filter(c=>bankName(c)===b).map(c=>c.id)}
function bankAllSelected(b){let ids=bankIds(b);return ids.length>0&&ids.every(id=>enabled.includes(id))}
function toggleBank(b){let ids=bankIds(b);if(ids.every(id=>enabled.includes(id)))enabled=enabled.filter(id=>!ids.includes(id));else enabled=[...new Set([...enabled,...ids])];persistEnabled();renderWallet()}
function toggleCard(id,on){enabled=on?[...new Set([...enabled,id])]:enabled.filter(x=>x!==id);persistEnabled();renderWallet()}
applySiteName();if(!localStorage.getItem(BACKUP_KEY))saveAutoBackup('initial');fetchLiveFx().finally(render);
let __vpTimer=0;function syncViewport(){clearTimeout(__vpTimer);__vpTimer=setTimeout(()=>{try{let vv=window.visualViewport;document.documentElement.style.setProperty('--app-vh',((vv?vv.height:window.innerHeight)*.01)+'px')}catch(e){}},120)}
window.addEventListener('resize',syncViewport,{passive:true});window.addEventListener('orientationchange',syncViewport,{passive:true});if(window.visualViewport)window.visualViewport.addEventListener('resize',syncViewport,{passive:true});syncViewport();
</script></body></html>
